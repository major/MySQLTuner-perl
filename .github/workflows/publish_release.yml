name: Publish Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Package and Attach Deliverables
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Prepare Release Artifacts
        id: prepare
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          VERSION=$(tr -d '[:space:]' < CURRENT_VERSION.txt)
          SAFE_REF="${REF_NAME//\//-}"
          mkdir -p dist
          cp mysqltuner.pl dist/
          cp vulnerabilities.csv dist/
          cp basic_passwords.txt dist/
          tar -czvf "dist/mysqltuner-${SAFE_REF}.tar.gz" mysqltuner.pl vulnerabilities.csv basic_passwords.txt LICENSE README.md
          cd dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Upload Release Assets
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: ${{ github.event.release.tag_name || format('v{0}', steps.prepare.outputs.version) }}
          files: |
            dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
